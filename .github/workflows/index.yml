# Rebuilds the plugin index every 30 minutes (and on demand) and commits it
# when something changed. Nothing is installed: the indexer is a
# zero-dependency Node script, and the workflow's own GITHUB_TOKEN is enough
# for the search API and the push.

name: Index plugins

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs race on the same commit.
concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build the index
        run: node scripts/index.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace.json
          if git diff --cached --quiet; then
            echo "Index unchanged."
          else
            git commit -m "chore: refresh the plugin index"
            git push
          fi
